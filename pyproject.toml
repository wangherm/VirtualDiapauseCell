[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vdc-research"
version = "0.4.0"
description = "Modular research framework for Virtual Diapause Cell; no pretrained biological model included"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26", "scipy>=1.11", "torch>=2.6", "PyYAML>=6"]

[project.optional-dependencies]
test = ["pytest>=8", "httpx>=0.27", "fastapi>=0.115"]
serve = ["fastapi>=0.115", "uvicorn>=0.30"]
knowledge = ["transformers>=4.51,<5", "peft>=0.17", "accelerate>=1", "bitsandbytes>=0.45", "datasets>=3"]

[project.scripts]
vdc = "vdc.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
